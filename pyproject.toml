[project]
name = "triage"
version = "0.1.0"
description = "Decision layer for Razorpay payment failures: 110 error codes to eight bounded action classes."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]
# Declared for Stage 4. Not installed yet: `uv sync --extra ml` when that stage starts.
ml = [
    "lightgbm",
    "pandas",
    "numpy",
    "scikit-learn",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# Render service definition — free tier.
#
# The instance is read-only: evaluation runs are pre-computed and baked into the image.
# A visitor can read every result and ask for a decision on any of the 110 codes, but
# nothing they do mutates the store.
services:
  - type: web
    name: triage-api
    runtime: docker
    plan: free
    region: singapore          # nearest to the Indian payment rails being modelled
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: TRIAGE_READ_ONLY
        value: "true"
      - key: TRIAGE_DB_DIR
        value: /app/eval/runs
      - key: TRIAGE_DB_PATH
        value: /app/eval/runs/exhibit.db
      # Explicit origins, not "*". Set the Vercel domain here after the first deploy.
      - key: TRIAGE_CORS_ORIGINS
        value: "http://localhost:3000,https://triage-dashboard.vercel.app"
